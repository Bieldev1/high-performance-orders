name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependências
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -f Api/Dockerfile -t high-performance-orders-api:ci .

  test:
    runs-on: ubuntu-latest
    needs: build

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Your_password123"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_password123' -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Aplicar schema e índices
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/database/scripts:/scripts \
            mcr.microsoft.com/mssql-tools18 \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_password123' -C \
            -i /scripts/01-create-tables.sql

      - name: Seed de dados (versão reduzida para CI)
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/database/scripts:/scripts \
            mcr.microsoft.com/mssql-tools18 \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_password123' -C \
            -i /scripts/02-seed-data-ci.sql

      - name: Restore dependências
        run: dotnet restore Tests/Tests.csproj

      - name: Testes de integração
        run: dotnet test Tests/Tests.csproj --no-restore --configuration Release
